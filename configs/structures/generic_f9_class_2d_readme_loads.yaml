# Structural model of the push load for the README-loads fork (SP7 step S2).
#
# The bridge file of design 4.3: it reuses every coefficient section of the gate file
# configs/structures/generic_f9_class_2d.yaml unchanged (copied byte for byte; a test
# compares them) and its layout; only its identity fields (name, description, applies_to),
# its mixture notes, its breakdown and its own frozen sets differ (the breakdown: source
# note docs/phases/inputs/2026-10-08-SP7-sources.md section 5.3, with D-SP7-37's k_ts central
# 0.2805 kg/kN in the thrust-structure placement). The vehicle generic_f9_class_2d_readme_loads
# has no LOX/RP-1 split: its fractions are assumed equal to the gate's. Frozen at S2's commit
# (D-SP7-31). Its own sets come from the same search on its own pad and headline push.
# The `sets` block at the end (the physics band's and the outer envelope's frozen sets,
# labelled "the extremes found by the screened search over the stated ranges", never bounds)
# was written by S2's screened search (design 4.2.6, source note section 9.3) from the
# tree on parent commit 4494fe1; tests/test_structure_search.py::test_frozen_sets_reproduce[generic_f9_class_2d_readme_loads]
# reproduces it from a fresh pad flight.

name: generic_f9_class_2d_readme_loads
description: First-order structural model of the push load for the README-loads fork generic_f9_class_2d_readme_loads (SP7; the gate file's coefficients and layout, the fork's breakdown).
applies_to: [generic_f9_class_2d_readme_loads]

layout:
  radius_m: {value: 1.83, source: "FUG15 Table 2-1, PDF p.11; FUG25 Table 2-1, printed p.9 (3.66 m, both stages)"}
  stations_per_barrel: {value: 200, assumed: true, note: "numerical resolution, not a physics coefficient; every barrel and the aft skirt (source note section 2.3); S2's doubling test checks it"}
  fairing_height_m: {value: 13.2, source: "FUG15 section 5.1.2, PDF p.36; FUG25 printed p.16 (13.2 m overall; the implied stack length of source note section 2.4)"}
  stack_length_m: {value: 70.0, source: "FUG15 Table 2-1, PDF p.11; FUG25 Table 2-1, printed p.9 (70 m with interstage and fairing; the length budget of source note section 2.4, not imposed)"}
  stages:
    - name: stage1
      tank_order: {value: [rp1, lox], source: "FUG15 PDF p.10; FUG25 printed p.8 (a common dome between LOX and RP-1; the LOX transfer tube runs through the RP-1 tank, so LOX is above RP-1)"}
      common_dome: {value: true, source: "FUG15 PDF p.10; FUG25 printed p.8"}
      construction:
        value: {aft_skirt: stiffened_gerard, rp1_barrel: stiffened_gerard, lox_barrel: monocoque_sp8007, domes: membrane_dome, transfer_tube: hoop_tube, load_ring: ring_frame, interstage: composite_relation}
        assumed: true
        note: "Barrels from FUG15 Table 2-1, PDF p.11 ('LOX tank - monocoque; Fuel tank - skin and stringer'); the aft skirt's stiffened form, the domes as crown-sized membranes, the tube's hoop, the ring frame and the interstage's relation are the design's forms (design 4.2, 4.2.3, 4.2.4; source note sections 2.3 and 12)"
    - name: stage2
      tank_order: {value: [rp1, lox], assumed: true, note: "Assumed the same as stage 1 from 'a shorter version of the first-stage tank' (FUG15 PDF p.11; FUG25 printed p.9). The guides disagree read literally: the latch sentence puts the fuel tank at the base (FUG15 PDF p.12), the harness sentence at the top (FUG15 PDF p.38); source note section 2.2"}
      common_dome: {value: true, assumed: true, note: "assumed from the same sentence as the tank order (source note section 2.2)"}
      construction:
        value: {rp1_barrel: stiffened_gerard, lox_barrel: monocoque_sp8007, domes: membrane_dome, transfer_tube: hoop_tube}
        assumed: true
        note: "FUG15 Table 2-1: the same construction wording for stage 2 ('Fuel tanks'); the tank order is assumed (source note section 2.2)"
      aft_skirt_length_m: {value: 0.0, assumed: true, note: "inferred from the latch sentence alone (FUG15 PDF p.12): the latches sit at the base of the stage-2 tank, so stage 2 has no aft skirt in the load path (source note sections 2.2 and 12)"}

mixture:
  stage1:
    lox_mass_fraction: {value: 0.699440, assumed: true, note: "Assumed equal to the gate's 287.4/410.9 (the same engines, so the same mixture ratio, inferred); the fork's vehicle file has no split (source note sections 2.3, 5.3)"}
  stage2:
    lox_mass_fraction: {value: 0.699535, assumed: true, note: "Assumed equal to the gate's 75.2/107.5 (source note sections 2.3, 5.3)"}

materials:
  block_alloy: {value: "2195", assumed: true, note: "The barrels' alloy from FUG15 Table 2-1, PDF p.11 ('Aluminum lithium skin'), read as 2195 (LOV10 Table 1, PDF p.3: 2195-T8R78); assumed for the aft skirt, the ring frame and the transfer tube, whose alloys are not public (source note sections 2.3, 3.1 and 11)"}
  E_GPa: {central: 75.84, low: 72.0, high: 79.6, assumed: true, note: "Central: LOV10 Table 1, PDF p.3 (2195-T8R78, 11.0 Msi) and HL19 PDF p.12, 18 (11.0 Msi 'a typical conservative design assumption'; tension 10.8 and compression 11.4 Msi = 74.5 and 78.6 GPa). Range +/-5% assumed, covering both opened moduli; the high end 1.3% above the compression modulus is an allowance (source note section 3.1)"}
  nu: {central: 0.33, low: 0.30, high: 0.33, source: "LOV10 Table 1, PDF p.3; HL19 PDF p.12 (0.33); SP8007-20 Eq. 49, PDF p.51 and SP8007-68 write their simplified constants for nu = 0.3 (the low end)"}
  rho_wall_kg_per_m3: {central: 2712.6, low: 2698.8, high: 2726.5, source: "LOV10 Table 1, PDF p.3 (0.098 lb/in^3); HL19 PDF p.12; the range is the published value's last digit, 0.0975-0.0985 lb/in^3"}
  F_tu_MPa: {central: 558.5, low: 520.0, high: 558.5, assumed: true, note: "Central and high: LOV10 Table 1, PDF p.3 (81.0 ksi, room temperature). Low assumed (-7%): a statistically based allowable and the weaker plate direction sit below a datasheet value (source note section 3.1)"}
  eta_weld: {central: 1.00, low: 0.70, high: 1.00, assumed: true, note: "Central and high a rule from Wu's factor practice (WU13 PDF p.1, 8; WU24 PDF p.27: the coarse non-optimum factors carry the weld lands), an analogue; low BHAT01 PDF p.5 (friction-stir welds in 2195 at 70% of parent metal). Applies to hoop, the combined mode, the domes and the tube (source note section 3.1)"}
  dome_alloy:
    central: "2219-T851"
    alternatives: ["2195"]
    assumed: true
    note: "Central: FUG15 and FUG25 Table 2-1 'Aluminum lithium skin; aluminum domes' read as a conventional alloy (inferred); 2219-T851 is the one conventional tank alloy whose allowables were opened (LOV10 Table 1, PDF p.3; SA503 PDF p.58: the S-IC's 2219 bulkheads). Alternative: the 2195 block if 'aluminum' includes Al-Li (WU13 PDF p.3: the SLWT LO2 aft bulkhead's 2195 gores, an opened analogue with an assumed reading); source note section 3.1"
  dome_alloys:
    "2219-T851":
      F_tu_MPa: {value: 455.05, source: "LOV10 Table 1, PDF p.3 (2219-T851 Ftu 66.0 ksi, from MMPDS-04)"}
      rho_wall_kg_per_m3: {value: 2851.0, source: "LOV10 Table 1, PDF p.3 (0.103 lb/in^3; derived 2851.0 kg/m^3)"}

factors:
  FS_ult: {value: 1.40, source: "FUG15 section 1.4, PDF p.6 (1.4 versus the traditional 1.25 for flight without crew); STD5001B Table 1, PDF p.18 (ultimate 1.4); FUG25 Table 6-1, printed p.43 (1.40 for ground operations); SX09 (tank ultimate 1.4 x MEOP)"}

pressures:
  stage1_lox:
    p_meop_bar: &p_meop {central: 2.62, low: 1.24, high: 4.00, assumed: true, note: "The ullage MEOP, without the acceleration head (one value for the pad, the push and flight). Basis assumed: one differential (gauge) value in every case; whether Falcon 9 regulates in absolute or gauge terms is not public (most analogues are psia read at altitude); if it regulates in absolute terms the push's relief at sea level is overstated, which lowers dm (source note sections 1.4 and 3.2). Central: the midpoint. Low: the S-IC LOX tank's pad prepressurization, 'a maximum of 18 psig' (SA503 PDF p.69), an analogue applied to all four tanks. High assumed: above the highest opened analogue (LOV10 PDF p.4, 50 psi = 3.45 bar), an allowance for a pressure-stabilized tank. No Falcon 9 value is public (source note section 3.2)"}
    p_min_fraction: &p_min {central: 0.84, low: 0.40, high: 0.93, assumed: true, note: "p_min = fraction x MEOP, unfactored. Central: the S-IVB LOX tank's regulation band bottom over its relief valve's top setting, 38/45 psia (SA503 PDF p.129-130, Figure 6-9), an upper bound on the ratio. High: the highest flown band ratio, S-IVB LOX 38-41 psia (0.93), kept although an upper bound. Low: LOV10 PDF p.4's design-study relief, 20 of 50 psi (0.40), an analogue (source note section 3.2)"}
  stage1_rp1:
    p_meop_bar: *p_meop
    p_min_fraction: *p_min
  stage2_lox:
    p_meop_bar: *p_meop
    p_min_fraction: *p_min
  stage2_rp1:
    p_meop_bar: *p_meop
    p_min_fraction: *p_min

buckling:
  s_dg:
    central: 1
    alternatives: [0]
    source: "SP8007-20 Eq. 48-49, PDF p.50-51 and SP8007-68 section 4.2.5.4, PDF p.24-25 prescribe Delta_gamma for internally pressurized cylinders (central); STD5001B FSR 19, 54 allow a stabilizing pressure unfactored at its minimum. Alternative 0, no credit: SP8007-20 PDF p.51 (untested configurations 'could result in unconservative designs') and LOV10 PDF p.5. Used on the monocoque LOX barrels only, at p_min (source note section 3.3)"
  k_stiff: {central: 0.65, low: 0.65, high: 0.75, source: "SP8007-20 PDF p.53 (tests 'as low as 65%', so 0.65; the current recommendation, the central and low end); SP8007-68 PDF p.28 (0.75, the high end); IDH section 4.2, PDF p.62 (0.65); LOV10 PDF p.5 (0.65 baseline)"}
  gerard_row:
    central: ring_common_z
    alternatives: [plate_limited]
    assumed: true
    note: "GL66 Table 2, PDF p.31 (printed 27): ring-stiffened with common Z stringers (C 6.48, n 3/5; structure.GERARD_ROWS holds the pairs), the row nearest LOV10's PANDA2 optimized 2195 designs (LOV10 PDF p.6-8). The plate-limited alternative's growth law (thickness proportional to the load, anchored at the central row's envelope thickness before the gauge floor) is inferred from LOV10's 2195 plate limit. ring_common_y and the two improved rows are sizing-only lines (source note section 3.3)"
  t_min_mm: {central: 1.65, low: 1.22, high: 1.676, assumed: true, note: "Central: LOV10 PDF p.4's minimum manufacturing gauge 0.065 in (another member's gauge, an analogue). High: WU13 PDF p.6's 0.066 in minimum on the SLWT's 2195 bulkheads (flight hardware of another vehicle, an analogue). Low: r/1500, SP-8007's validity limit (SP8007-68 Eq. 6, PDF p.15; SP8007-20 Eq. 10, PDF p.42); source note section 3.3"}
  delta_gamma_table:
    source: "SP8007-20 Figure 4-5, PDF p.51 (printed 33), the curve of Eq. 48-49, read from the 2020 edition's vector path (27 cubic segments) without reading error; the table follows the curve's lower non-decreasing envelope above x = 2.40, floored to four decimals, with (0, 0) added and two nodes (x = 0.0261, 0.883) where the chord rose above the curve; constant beyond x = 10 (source note section 6.3)"
    note: "x = (p/E)(r/t)^2; the 1968 scan (SP8007-68 Fig. 6, PDF p.25) reads 0.2-6.2% lower and is not ranged separately (s_dg spans none to the 2020 curve)"
    points:
      - {x: 0.0, delta_gamma: 0.0}
