[project]
name = "launchsim"
version = "0.1.0"
description = "Research simulator for ground-powered launch assist (launch-assist-sim)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.3",
  "scipy>=1.16",
  "pandas>=3.0",
  "matplotlib>=3.10",
  "pydantic>=2.11",
  "pyyaml>=6.0.2",
  "ambiance>=1.3.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16"]

[dependency-groups]
dev = ["launchsim[dev]"]

[project.scripts]
launchsim = "launchsim.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: slower than 5 s"]
filterwarnings = ["error"]
