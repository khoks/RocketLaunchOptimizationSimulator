   classes (t, ts, th, box, c-gray, leader) and the variable (--s) that the chat widget host
   supplied. They are not the project's brand tokens. */
svg { --s: #444441; background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.t { font-size: 14px; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
.box { fill: #ffffff; stroke: #b4b2a9; stroke-width: 0.5; }
.c-gray { fill: #e8e6df; stroke: #5f5e5a; stroke-width: 0.5; }
.leader { fill: none; stroke: #888780; stroke-width: 0.5; }
</style>
