/* Written by launchsim app (src/launchsim/templates/app.html): a placeholder of SP2 step A4b;
   step A5 replaces it with the form, the launch progress, the results panel and the scene.
   The server sends the Content-Security-Policy as a header, with this page's one inline script
   by its sha256. Every value from the server reaches the page by textContent.
   Rule for step A5 (exit criterion 17): GET / is the one route another site can reach, so on
   load this page issues only GET requests to /api/form, /api/job and /api/results. It never
   starts a launch, sends a dry run or requests /scene/... from location.hash, location.search,
   document.referrer or a postMessage; those follow a user's click or key only. */

}

  padding: 4px 16px 12px; margin-top: 16px; }

<h1>launch-assist-sim: local app</h1>
</header>
<p>Serving at <code id="url">(loading)</code>, on this machine only.</p>
<p>The launch form arrives in step A5.</p>
<p id="exploratory"></p>
<section>
<h2>Results directories</h2>
<p id="status">Loading the results directories...</p>
<div id="groups"></div>
</section>
</div>
<script type="application/json" id="app-data">__APP_DATA__</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("app-data").textContent);
  document.getElementById("url").textContent = data.url;
  document.getElementById("exploratory").textContent =
    "Every launch from this app is exploratory, not a finding.";
  var status = document.getElementById("status");
  var groups = document.getElementById("groups");

  function rowText(row) {
    var text = row.experiment + "/" + row.timestamp + ": " + row.state;
    if (!row.playable && row.reason) { text += " (" + row.reason + ")"; }
    if (row.description) { text += ". " + row.description; }
    if (row.line && row.state !== "complete") { text += ". " + row.line; }
    return text;
  }

  function show(listing) {
    var total = 0;
    listing.groups.forEach(function (group) {
      var title = document.createElement("h2");
      title.textContent = group.title + " (" + group.rows.length + ")";
      groups.appendChild(title);
      var list = document.createElement("ul");
      group.rows.forEach(function (row) {
        var item = document.createElement("li");
        item.textContent = rowText(row);
        list.appendChild(item);
        total += 1;
      });
      groups.appendChild(list);
    });
    var others = listing.not_listed ? "; " + listing.not_listed + " other entries not listed" : "";
    status.textContent = total + " directories" + others + ".";
  }

  fetch("/api/results", { cache: "no-store", credentials: "same-origin" })
    .then(function (response) {
      if (!response.ok) { throw new Error("HTTP " + response.status); }
      return response.json();
    })
    .then(show)
    .catch(function (error) {
      status.textContent = "The results directories could not be loaded: " + error.message;
    });
})();
</script>
