buckling:
  s_dg:
    central: 1
    alternatives:
    - 0
    source: 'SP8007-20 Eq. 48-49, PDF p.50-51 and SP8007-68 section 4.2.5.4, PDF p.24-25 prescribe Delta_gamma
      for internally pressurized cylinders (central); STD5001B FSR 19, 54 allow a stabilizing pressure
      unfactored at its minimum. Alternative 0, no credit: SP8007-20 PDF p.51 (untested configurations
      ''could result in unconservative designs'') and LOV10 PDF p.5. Used on the monocoque LOX barrels
      only, at p_min (source note section 3.3)'
  k_stiff:
    central: 0.65
    low: 0.65
    high: 0.75
    source: SP8007-20 PDF p.53 (tests 'as low as 65%', so 0.65; the current recommendation, the central
      and low end); SP8007-68 PDF p.28 (0.75, the high end); IDH section 4.2, PDF p.62 (0.65); LOV10 PDF
      p.5 (0.65 baseline)
  gerard_row:
    central: ring_common_z
    alternatives:
    - plate_limited
    assumed: true
    note: 'GL66 Table 2, PDF p.31 (printed 27): ring-stiffened with common Z stringers (C 6.48, n 3/5;
      structure.GERARD_ROWS holds the pairs), the row nearest LOV10''s PANDA2 optimized 2195 designs (LOV10
      PDF p.6-8). The plate-limited alternative''s growth law (thickness proportional to the load, anchored
      at the central row''s envelope thickness before the gauge floor) is inferred from LOV10''s 2195
      plate limit. ring_common_y and the two improved rows are sizing-only lines (source note section
      3.3)'
  t_min_mm:
    central: 1.65
    low: 1.22
    high: 1.676
    assumed: true
    note: 'Central: LOV10 PDF p.4''s minimum manufacturing gauge 0.065 in (another member''s gauge, an
