geometry:
  aft_skirt_length_m:
    central: 6.045
    low: 2.0
    high: 10.09
    assumed: true
    note: 'Low assumed: the shortest skirt enclosing the deepest aft dome (1.83 m) with room for the thrust
      structure. High derived: the opened 70 m stack less the 13.2 m fairing (FUG15 PDF p.11, 36) less
      the model''s own tank lengths at the central coefficients (which rest on the vehicle file''s quoted
      masses and the density centrals at quoted temperatures) less the interstage''s minimum 2.745 m at
      a/b 4/3; an upper bound at those coefficients. Central: the midpoint. WIKI-FT''s 42.6 m [quoted]
      is context only (source note sections 2.4, 3.4)'
  dome_axis_ratio:
    central: 1.3333
    low: 1.0
    high: 1.4142
    assumed: true
    note: 'Central: WU13 PDF p.3, the SLWT LO2 aft bulkhead ''half of an ellipsoid with a height-to-radius
      ratio of 0.75'' (a/b = 1/0.75), the one opened flight-hardware analogue. Low: a hemisphere. High:
      sqrt(2), the design''s validity limit of the crown check (source note section 3.4)'
  ullage_fraction:
    central: 0.03
    low: 0.02
    high: 0.05
    assumed: true
    note: synthetic test value (tests/data/structure_synthetic.yaml, SP7 step S3), not a source
  rho_lox_kg_per_m3:
    central: 1253.3
    low: 1141.2
    high: 1306.1
    assumed: true
    note: 'NIST-O2 (fetched 2026-10-08): 1253.31 kg/m^3 at 66.5 K and 0.3 MPa, the central at WIKI-FT''s
      quoted 66.5 K load temperature [quoted]; 1141.2 saturated at the normal boiling point and 1306.08
      at the triple point (the physical span near 1 bar). Both stages (source note section 3.4)'
  rho_rp1_kg_per_m3:
    central: 819.9
    low: 785.0
    high: 829.2
    assumed: true
    note: 'NIST6646 Table 8, PDF p.41 (813.25 at 2.90 C ... 785.02 at 43.09 C; slope -0.696 kg/m^3/K between
      the two lowest). Central: extrapolated to WIKI-FT''s quoted -6.6 C [quoted]. Low: the warmest opened
      reading. High assumed: the same slope to -20 C. Both stages (source note section 3.4)'
  tube_diameter_m:
    central: 0.65
    low: 0.4
    high: 0.9
    assumed: true
    note: 'No source public: a fast to a slow LOX feed (12.0, 4.5 and 2.4 m/s at 1.505 m^3/s); central
      the midpoint. Stage 1''s LOX transfer tube (source note section 3.4)'
  tube_diameter_ratio:
    value: 0.3265
    assumed: true
    note: Stage 2's tube over stage 1's, sqrt(Q2/Q1) from the vehicle file's thrusts and Isp values [quoted]
      and the quoted mixture fractions (source note sections 3.4, 12)
  interstage_length_m:
    central: 4.5
    low: 3.66
    high: 10.83
    assumed: true
    note: 'Central: WIKI-FT 4.5 m [quoted]. Low: the shortest interstage enclosing two hemispherical domes
      (2 r), the MVac''s length below its dome assumed zero. High: the opened 70 m less 13.2 m less the
      model''s tank lengths at the central coefficients less the skirt''s 2.0 m minimum (source note sections
      2.4, 3.4). Acts only when the upper stack is sized'
load_entry:
  skirt_envelope_path:
    central: hold_down
    alternatives:
    - flight_thrust
    assumed: true
    note: 'Central: the hold-down support at the base (FUG15 PDF p.60, ''held down at the base via hydraulic
      clamps'', with the model''s own records), because Falcon 9''s thrust passes through the engine mount
      into the tank (inferred). Alternative, assumed with no source: the flight thrust path through the
      skirt (a higher envelope, lower dm); design appendix A SP-11, N17 (source note section 3.5)'
  ring_h_over_b:
    central: 6.5
    low: 1.0
    high: 12.0
    assumed: true
    note: 'h the section depth along the push, b its radial width. High: LOV10 PDF p.4-5''s manufacturing
      limit 12.0 on orthogrid rings (an analogue). Low assumed: a square section. Central: the midpoint.
      The ring is sized to the larger of bending and the torsion-plus-shear and von Mises check (D-SP7-37;
      source note sections 3.5, 11, 13 item 15)'
  fitting_factor:
    value: 1.15
    assumed: true
    note: 14 CFR 25.625 (CFR25, opened 2026-10-08), 'a fitting factor of at least 1.15', an analogue regulation,
      the ring assumed wrought; applied to the whole ring section (source note section 3.5)
