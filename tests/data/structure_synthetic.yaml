ring:
  ring_pads:
    central: 8
    low: 4
    high: 8
    assumed: true
    note: 'A facility choice. Central: the engine mount''s eight-fold symmetry (FUG25 printed p.8, inferred
      as a layout). Low: the four leg attachments (FUG15 PDF p.10). High: the central, because above it
      the saving would rest partly on uncharged per-pad hardware (source note section 4)'
thrust_structure:
  k_ts_kg_per_kN:
    central: 0.2805
    low: 0.197
    high: 0.628
    assumed: true
    note: 'The mass per kN of added load between T_max and the push''s load through the thrust structure.
      Central: the median of the opened readings counted once per relation (D-SP7-37), below the note''s
      nine-reading median 0.306 by 8.3% (and 0.2% above the design''s 0.28), so at central the thrust-structure
      row''s dm, linear in k_ts, is 8.3% lower than at the note''s value. Low: Wu''s S-II cone law applied
      across vehicles and the push (WU24 PDF p.13; derived, an analogue). High: Castellini''s Ref. 5 curve
      extrapolated 65% beyond its chart with unknown parameters (CAS12 PDF p.83-84), kept as the adverse
      end (D-SP7-37). The readings are in plausibility (source note section 4)'
interstage:
  interstage_k1_kg_per_m2p4856:
    value: 13.74
    source: 'CAS12 Table 15, PDF p.83 (printed 65): lower-stage interstage M = k_SM k1 S (3.2808 D)^k2
      with k1 7.7165; in SI 7.7165 x 3.2808^0.4856 = 13.740 (derived)'
  interstage_k2:
    value: 0.4856
    source: CAS12 Table 15, PDF p.83
  interstage_k_sm:
