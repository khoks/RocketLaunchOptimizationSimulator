sets:
  label: the extremes found by the screened search over the stated ranges
  source: SP7 step S2's screened search (src/launchsim/structure.py screened_search; design 4.2.6, source
    note section 9.3), reproduced by tests/test_structure_search.py::test_frozen_sets_reproduce[generic_f9_class_2d_readme_loads]
  method: 'Design 4.2.6 and source note section 9.3, searches A to C (D, the design axes'' break-even
    values, is not frozen here), sizing only, at the headline push of silo_offload_2d_readme''s silo_cold
    (the analytic constant_accel case at a stage-1 offload of 36006.44430169878 kg and P_ref 24700.013061881455
    kg) on the envelope of its pad baseline as flown. A: the physics band at the design axes'' central:
    the tornado, 5-point scans, step 3 (monotone coefficients at their ends; the pressures and any other
    non-monotone coefficient on 3 points per set direction, crossed with the (s_dg, gerard_row) combinations,
    stage by stage), then the polish of D-SP7-38 (each varied coefficient moved alone over its 5 scan
    points or its choices, re-read at the end itself, until a pass moves nothing; at most 4 passes). B:
    the stage-2-only five per physics set at the step row (DLF 2), enumerated and polished with every
    other coefficient at A''s value. C: the outer envelope, A re-run at the design axes'' two corners
    (the margin''s direction from its tornado). Checks, recorded and not acted on: 500 seeded samples
    for A (numpy default_rng; B and C their own), and a one-coordinate check from each found end (9 points
    per continuous coefficient, every other choice of a discrete one; B''s also over the stage-1 coefficients
    it holds at A''s values). The ends are the extremes this search found, not bounds: neither check proves
    an end extreme.'
  evaluation_count: 6836
  fallbacks: []
  seed: 20261008
  parent_commit: 4494fe1
  test: tests/test_structure_search.py::test_frozen_sets_reproduce[generic_f9_class_2d_readme_loads]
  note: 'Timing (sim.time_structure_sizing on the development machine before the search, 2026-10-09):
    one sizing with a fresh geometry and envelope took 22.7 ms at the headline and 40.1 ms at the step
    row (median of 20 after a warm-up), so the 6198 planned sizings (source note 9.3''s 3263 plus the
    polish''s bound of 2935, D-SP7-38) needed about 249 s against the 600 s budget and no fallback applied;
    searches A to C took 235 s for 6836 sizings (beyond the note''s plan: ring_h_over_b is non-monotone
    and multiplies stage 1''s grid by three, as section 9.3 prescribes, and the polish adds its moves).
    Stack lengths: the high-mass sets imply stacks of at least 80.2 m (physics) and 80.2 m (outer) against
    the opened 70 m; the length budget is not imposed, which inflates the high-mass end (source note sections
    2.4, 9.3 and 11). Checks: the seeded samples spread over the whole box and never come near a found
    end (each records its most extreme sample beside the end''s dm), so their zero excess has little power;
    the one-coordinate check from each end (D-SP7-38) is the sharper test and records the move that comes
    closest or goes beyond. The dm numbers here are sizing-only values at the search''s push, not findings.
    Objective: the search ranks dm1 + dm2 unweighted, while the coupled placement charges a kg of stage-2
    increment at w = 5.478 kg of stage-1 dry mass; where stage 2 is sized (B at the step row, C''s high
    corner) the ends are extremes of the unweighted sum. Scored on dm1 + w dm2 with the same one-coordinate
    moves (a check of S2''s second review round), the one-coordinate excesses are (the recorded unweighted
    ones in brackets): B low 0.0 kg (0.0), B''s low-mass held check 181.0 (149.1), B''s high-mass held
    check 43.2 (43.2), C high 42.0 (7.7, pressures.stage2_rp1.p_meop_bar 1.585); A and the low corner
    do not size stage 2, so there the two agree. outer_low_mass''s stage-2-only five are physics_low_mass''s
    (search B at the step row), not searched or checked at its corner, which does not size stage 2. Not
    compared by the test.'
