# The README-loads fork of the structural headline (SP7 step S6a; design
# docs/phases/inputs/2026-10-08-SP7-design.md, section 4.10, file C): the uncharged and the
# central structural stage-1 offload of experiments/silo_structure_2d.yaml, solved the same
# way on generic_f9_class_2d_readme_loads.yaml (mass set A, the README / 1-D masses), which
# calibrates inside the band (24,700.0 kg, +8.33% against 22,800 kg; case readme_loads of
# docs/findings/CAL-f9-leo-2d.md) where the gate fork misses it (+14.3%). One robustness row
# against the calibration miss, as SP1's bridge (D-SP1-13) was for the uncharged headline.
# The structure file is configs/structures/generic_f9_class_2d_readme_loads.yaml, frozen at
# SP7 step S2's commit 45e39d4 (D-SP7-31): the gate file's coefficient sections unchanged (a
# test compares them), this fork's layout masses, mixture and breakdown, and its own frozen
# sets; a first-order station sizing, not a detailed structural design. This fork has no
# penalty curve of its own (SP1 solved no penalty row on it).
#
# Pre-registered (SP7 step S6a): committed before any run; how it is read is in
# docs/phases/inputs/2026-10-15-SP7-preregistration.md. Never edit after the
# pre-registration commit (a change is an amendment, its own commit).
#
# Shared blocks and the baseline with its integrator: copied verbatim from
# experiments/silo_offload_2d_readme.yaml (identical to every planar experiment's; a test
# pins that). No energy block: the schema does not require one, and this fork has no
# sourced LOX / RP-1 split (its loads are README assumptions).
name: silo_structure_2d_readme
vehicle: configs/vehicles/generic_f9_class_2d_readme_loads.yaml
dynamics: planar_2d
site: {latitude_deg: 28.5, azimuth_deg: 90, include_rotation: true}
target_orbit: {kind: circular, altitude_km: 200}
guidance:
  kick: {v_kick_mps: 50, mode: hold_to_alignment, max_duration_s: 60, deadline_s: 60}
  stage1: gravity_turn
  stage2: {law: linear_tangent, frame: local_horizontal, cutoff: energy}
search:
  figure_of_merit: payload
  gamma_grid_deg: [8, 36, 2]
  gamma_refine_halfwidth_deg: 4
  gamma_xatol_deg: 0.01
  gamma_refine_maxiter: 30
  gamma_root_tol_deg: 0.01
  delta_bracket_deg: [0.1, 45]
  delta_step_deg: 0.25
  delta_xtol_rad: 1.0e-10
  payload_half_bracket_t: 2.0
  payload_max_expand: 6
  payload_backoff_max: 4
  payload_xtol_kg: 0.5
  brentq_rtol: 8.881784197001252e-16         # 4 eps, scipy brentq's floor
  final_payload_xtol_kg: 0.05
  final_bracket_kg: [20, 1000]
  search_rtol: 1.0e-8
  search_atol_scale: 10
  final_rtol: 1.0e-10
  penalty: {base_kg: 1.0e6, per_deg_kg: 1.0e4}
  ltg: {accept_r_m: 1.0, accept_vr_mps: 1.0e-3, r_scale_m: 1.0e4, vr_scale_mps: 100,
        fd_step_search: 1.0e-4, fd_step_final: 1.0e-5, max_iters: 25, max_halvings: 6,
        grid_max_rungs: 2, p0_offset_deg: 5, pf_deg: -1, steep_p0_deg: 35,
        shallow_guess: [0.3, 0.3], pitch_bounds_deg: [-45, 75], tau_max_factor: 2.0,
        mass_floor_factor: 0.5}
checks:
  closure_tol_mps: 1.0e-5
  identity_tol_mps: 1.0e-5                 # 2-D loss-identity residual (plan section 11)
  insertion_e_max: 1.0e-6                  # insertion eccentricity (plan section 11)
  grav_ratio_bounds: [0.33, 3.0]
  bp_ratio_bounds: [0.33, 3.0]
  min_term_mps: 1.0
  max_drag_steer_share: 0.5
  anchor_margin_kg: 1.5
  search_final_flag_rel: 1.0e-4
  maxq_scan_points: 256
  maxq_xatol_s: 1.0e-6
  unconstrained_kick_mps: 120
  vk_margin_kg: 5
  convergence: {rel_tol: 1.0e-3, loss_floor_mps: 1.0e-3, margin_floor_kg: 0.5,
                gamma_resolution_deg: 0.1, tighten_factor: 10, max_step_factor: 0.5}
  gamma_sensitivity_step_deg: 0.5          # gamma*-sensitivity diagnostic step h (never changes a verdict)
  m2_role: diagnostic                      # M2 reported, never bug_suspect (user decision 2026-09-30)
baseline:                                  # pad: held down, full thrust exactly at release
  name: pad
  assist: {model: none}
  ignition: {stage1: {t_ign_s: -2.0, reference: release}, stage2: {t_ign_s: 0.0}}
  end: insertion
  integrator: {method: DOP853, rtol: 1.0e-10, planar_max_step_s: 2.0, sample_dt_s: 0.05}
variants:
  # silo_offload_2d_readme's (and silo_bridge_2d_readme's) silo_cold, copied verbatim: the
  # 3 g0 / 100 m vented vertical silo (exit 76.707 m/s at the mouth), massless carriage,
  # 5 g0 brake, drive efficiency 0.5 (assumed), no exhaust impingement; stage 1 lit 0.5 s
  # after release with the vehicle's 2 s ramp. Same resolved run dict as there (a test).
  silo_cold:
    assist: {model: constant_accel, net_accel_g: 3.0, stroke_m: 100, carriage_mass_t: 0,
             brake_decel_g: 5, drive_efficiency: 0.5, exhaust_impingement_fraction: 0.0,
             shaft: vented, track: {angle_deg: 90, exit_altitude_m: 0}}
    ignition: {stage1: {t_ign_s: 0.5, reference: release}}
# The structure block (SP7 step S3; design 4.3, D-SP7-21): this fork's structure file, frozen
# at S2's commit 45e39d4 (D-SP7-31; its sha256 is in the pre-registration). No payload case.
structure:
  file: configs/structures/generic_f9_class_2d_readme_loads.yaml
offload:
  reference: pad                           # P_ref = this fork's full-load pad P*
  pad_control: true                        # the stage-1 solve also on the pad (the solver's consistency test)
  cases:
    # SP1's bridge case on this fork, uncharged and without its paired pad (the paired pad's
    # attribution is SP1's and does not enter x*): reproduces SP1's 36,006.444 kg within
    # 0.002 kg (results/silo_offload_2d_readme/20261003T112956Z).
    - {name: silo_cold_s1, of: silo_cold, solve: stage1}
    # The structural headline on this fork: the central structure of this fork's file,
    # with the headline settings of silo_structure_2d's silo_cold_s1_st (sized for the
    # offloaded stack flown, Q2, D-SP7-02; the dynamic factor from the assumed rise time, Q7,
    # D-SP7-09; an aft ring, Q5, D-SP7-05; zero margin, Q3, D-SP7-03; no envelope cap).
    - {name: silo_cold_s1_st, of: silo_cold, solve: stage1,
       structure: {set: central, sizing: flown, dynamic: rise_time, entry: aft_ring,
                   margin: 0.0, envelope_cap_g: null, overrides: {}, plausibility_scaled: false}}
