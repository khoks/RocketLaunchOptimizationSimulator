# Generic Falcon 9-class vehicle for the planar 2-D model: mass set B, the recorded
# re-sourcing scope (Phase 2 decision 1; reported next to the gate, not the gate).
#
# Forked 2026-09-29 from generic_f9_class.yaml, which stays unchanged as the 1-D
# reference. NEVER EDIT THIS FILE AFTER THE FIRST CALIBRATION RUN: copy it to a new
# file instead (CLAUDE.md). Every number is {value, source} or {value, assumed: true};
# the C_D(M) table carries one provenance for the whole table. Units by suffix
# (_t, _kN, _s, _m2, _W_m2); config.py converts to SI.
#
# Set B re-sources exactly what TODO.md and the generic_f9_class.yaml notes recorded as
# needing it: the propellant loads (410.9 / 107.5 t) and the stage-2 dry mass (4.0 t),
# from Espace & Exploration No.39 via Wikipedia Falcon 9 Full Thrust. The stage-1 dry
# mass (25.6 t, assumed) and the fairing (1.9 t) keep their generic_f9_class.yaml
# values. Everything else is identical to the gate fork generic_f9_class_2d.yaml.
# Differences from generic_f9_class.yaml:
#   - stage1 propellant 410.9 t (was 395.7 t assumed); stage2 dry mass 4.0 t (was 3.9 t
#     assumed) and propellant 107.5 t (was 92.67 t assumed): source above.
#   - stage2 coast before ignition 11.0 s (was 3.0 s assumed): Falcon User's Guide 2021
#     Table 8-4, MECO T+145 s to SES-1 T+156 s.
#   - stage2 engine exit area 8.6 m^2 (assumed; the 1-D file has none, i.e. 0).
#   - fairing drop on the free-molecular-heating criterion 0.5 rho V^3 < 1,135 W/m^2
#     (User's Guide 2021 p.38) instead of at staging.
#   - new aero block: A_ref 10.52 m^2 (3.66 m body), Braeunig 2020 generic C_D(M) table
#     with PCHIP interpolation, cd_scale 1.0.
#   Unchanged: stage-1 dry mass, fairing, engines (9 x 914.1 / 845.2 kN, Isp_vac
#   311 s, 2 s ramp; MVac 981 kN, 348 s, step start), payload 22.8 t, screening Isp
#   (295 / 348 s).
#
# Version mix, disclosed: FT (2017) propellant and stage-2 mass with Block 5 thrust, as
# in the gate fork.
#
# Launch-mass closure: stages 25.6 + 410.9 + 4.0 + 107.5 = 548.0 t, plus the 1.9 t
# fairing = 549.9 t without payload, against the published launch mass of 549 t
# (spacex.com, 549,054 kg; whether that includes a payload is not stated). With the
# 22.8 t reference payload the stack is 572.7 t.
#
# Sibling forks: generic_f9_class_2d.yaml (set C, the default gate) and
# generic_f9_class_2d_readme_loads.yaml (set A); all three are run and reported with
# equal prominence.

name: generic_f9_class_2d_recorded_scope
description: Generic Falcon 9-class vehicle for the planar model (mass set B, recorded re-sourcing scope).

stages:
  - name: stage1
    dry_mass_t: {value: 25.6, assumed: true, note: "README assumption, kept in set B; SpaceX does not publish it (the FT table gives 22.2 t)"}
    propellant_mass_t: {value: 410.9, source: "Espace & Exploration No.39 via Wikipedia Falcon 9 Full Thrust (en.wikipedia.org/wiki/Falcon_9_Full_Thrust, first-stage propellant 287.4 LOX + 123.5 RP-1)"}
    engine:
      count: {value: 9, source: "spacex.com Falcon 9 page (9 Merlin 1D)"}
      thrust_vac_kN: {value: 914.1, source: "spacex.com Falcon 9 page, 8,227 kN vacuum / 9 = 914.11, rounded to 0.1 kN"}
      thrust_sl_kN: {value: 845.2, source: "spacex.com Falcon 9 page, 7,607 kN sea level / 9 = 845.22, rounded to 0.1 kN"}
      isp_vac_s: {value: 311, source: "en.wikipedia.org/wiki/SpaceX_Merlin specification table, Merlin 1D vacuum Isp 311 s"}
    startup:
      kind: ramp
      t_ramp_s: {value: 2.0, assumed: true, note: "linear ramp; F9 ignites at T-3 s and holds down"}
    coast_before_ignition_s: {value: 0.0, assumed: true, note: "first stage; no coast"}
  - name: stage2
    dry_mass_t: {value: 4.0, source: "Espace & Exploration No.39 via Wikipedia Falcon 9 Full Thrust (en.wikipedia.org/wiki/Falcon_9_Full_Thrust, second-stage empty mass)"}
    propellant_mass_t: {value: 107.5, source: "Espace & Exploration No.39 via Wikipedia Falcon 9 Full Thrust (en.wikipedia.org/wiki/Falcon_9_Full_Thrust, second-stage propellant 75.2 LOX + 32.3 RP-1)"}
    engine:
      count: {value: 1, source: "spacex.com Falcon 9 page (1 Merlin Vacuum)"}
      thrust_vac_kN: {value: 981, source: "spacex.com Falcon 9 page, MVac thrust (Block 5)"}
      isp_vac_s: {value: 348, source: "en.wikipedia.org/wiki/Falcon_9 specification table, second-stage Isp 348 s"}
      exit_area_m2: {value: 8.6, assumed: true, note: "MVac eps 165, ~3.3 m exit; p*A_e = 45 N at 70 km"}
    startup:
      kind: step
    coast_before_ignition_s: {value: 11.0, source: "Falcon User's Guide 2021 Table 8-4: MECO T+145 s, SES-1 T+156 s"}

fairing_mass_t: {value: 1.9, source: "en.wikipedia.org/wiki/Falcon_9, fairing section (approximately 1,900 kg); kept in set B"}
payload_mass_t: {value: 22.8, source: "spacex.com Falcon 9 page, LEO expendable (the rung-2 reference payload)"}
fairing_drop:
  trigger: free_molecular_heating
  limit_W_m2: {value: 1135, source: "Falcon User's Guide 2021 p.38 (fairing jettison when the free-molecular heating rate 0.5 rho V^3 falls below 1,135 W/m^2)"}

# Effective (loss-averaged) per-stage Isp for the ideal-rocket-equation screening only,
# as in generic_f9_class.yaml. The screening counts the heating-rule fairing as dropped
# at staging.
screening:
  stage_isp_eff_s:
    - {value: 295, assumed: true, note: "README stage-1 average Isp between sea level and vacuum"}
    - {value: 348, source: "en.wikipedia.org/wiki/Falcon_9 specification table, second-stage Isp 348 s (vacuum stage)"}

aero:
  reference_area_m2: {value: 10.52, source: "Falcon User's Guide 2021 Table 2-1, 3.66 m body; pi*3.66^2/4; Braeunig convention = main-body section"}
  cd_scale: {value: 1.0, assumed: true, note: "nominal; the sensitivity knob (vehicle.aero.cd_scale)"}
  interpolation: pchip
  cd_mach:
    mach: [0, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 1.0, 1.05, 1.1, 1.15, 1.2, 1.3, 1.5, 1.75, 2.0, 2.5, 3.0, 3.25, 3.5, 4.0, 4.5]
    cd: [0.460, 0.404, 0.387, 0.385, 0.388, 0.400, 0.450, 0.510, 0.589, 0.660, 0.710, 0.730, 0.722, 0.680, 0.606, 0.527, 0.460, 0.350, 0.273, 0.250, 0.236, 0.222, 0.220]
    assumed: true
    note: "Braeunig 2020 ballpark launcher curve: avg Saturn V (NASA TM X-53770; MPR-SAT-FE-69-1) and Mercury-Atlas MA-6 (TOR-930(2101)-3); total power-on C_D incl. base; generic, not Falcon 9"
