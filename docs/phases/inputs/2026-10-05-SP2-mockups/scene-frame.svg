<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 592" role="img">
<title>Mock-up frame of the 2-D launch scene, one second before release</title>
<desc>Two panels on one clock and one scale. Left: the pad rocket held down with its engines at half thrust. Right: the silo cross-section with the unlit rocket riding the carriage up the 100 m shaft, its stage-1 tank 90% full.</desc>
<style>
