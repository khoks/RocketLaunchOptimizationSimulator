geometry:
  aft_skirt_length_m: {central: 6.045, low: 2.0, high: 10.09, assumed: true, note: "Low assumed: the shortest skirt enclosing the deepest aft dome (1.83 m) with room for the thrust structure. High derived: the opened 70 m stack less the 13.2 m fairing (FUG15 PDF p.11, 36) less the model's own tank lengths at the central coefficients (which rest on the vehicle file's quoted masses and the density centrals at quoted temperatures) less the interstage's minimum 2.745 m at a/b 4/3; an upper bound at those coefficients. Central: the midpoint. WIKI-FT's 42.6 m [quoted] is context only (source note sections 2.4, 3.4)"}
  dome_axis_ratio: {central: 1.3333, low: 1.0, high: 1.4142, assumed: true, note: "Central: WU13 PDF p.3, the SLWT LO2 aft bulkhead 'half of an ellipsoid with a height-to-radius ratio of 0.75' (a/b = 1/0.75), the one opened flight-hardware analogue. Low: a hemisphere. High: sqrt(2), the design's validity limit of the crown check (source note section 3.4)"}
  ullage_fraction: {central: 0.0345, low: 0.020, high: 0.050, assumed: true, note: "Ullage over liquid volume (L = m (1 + u)/(rho A)). Central: the midpoint of SA503 PDF p.129, 131's S-IVB LOX 108/2,722 = 0.0397 and LH2 300/10,200 = 0.0294; the range widened (assumed) beyond that spread (source note section 3.4)"}
  rho_lox_kg_per_m3: {central: 1253.3, low: 1141.2, high: 1306.1, assumed: true, note: "NIST-O2 (fetched 2026-10-08): 1253.31 kg/m^3 at 66.5 K and 0.3 MPa, the central at WIKI-FT's quoted 66.5 K load temperature [quoted]; 1141.2 saturated at the normal boiling point and 1306.08 at the triple point (the physical span near 1 bar). Both stages (source note section 3.4)"}
  rho_rp1_kg_per_m3: {central: 819.9, low: 785.0, high: 829.2, assumed: true, note: "NIST6646 Table 8, PDF p.41 (813.25 at 2.90 C ... 785.02 at 43.09 C; slope -0.696 kg/m^3/K between the two lowest). Central: extrapolated to WIKI-FT's quoted -6.6 C [quoted]. Low: the warmest opened reading. High assumed: the same slope to -20 C. Both stages (source note section 3.4)"}
  tube_diameter_m: {central: 0.65, low: 0.40, high: 0.90, assumed: true, note: "No source public: a fast to a slow LOX feed (12.0, 4.5 and 2.4 m/s at 1.505 m^3/s); central the midpoint. Stage 1's LOX transfer tube (source note section 3.4)"}
  tube_diameter_ratio: {value: 0.3265, assumed: true, note: "Stage 2's tube over stage 1's, sqrt(Q2/Q1) from the vehicle file's thrusts and Isp values [quoted] and the quoted mixture fractions (source note sections 3.4, 12)"}
  interstage_length_m: {central: 4.5, low: 3.66, high: 10.83, assumed: true, note: "Central: WIKI-FT 4.5 m [quoted]. Low: the shortest interstage enclosing two hemispherical domes (2 r), the MVac's length below its dome assumed zero. High: the opened 70 m less 13.2 m less the model's tank lengths at the central coefficients less the skirt's 2.0 m minimum (source note sections 2.4, 3.4). Acts only when the upper stack is sized"}

load_entry:
  skirt_envelope_path:
    central: hold_down
    alternatives: [flight_thrust]
    assumed: true
    note: "Central: the hold-down support at the base (FUG15 PDF p.60, 'held down at the base via hydraulic clamps', with the model's own records), because Falcon 9's thrust passes through the engine mount into the tank (inferred). Alternative, assumed with no source: the flight thrust path through the skirt (a higher envelope, lower dm); design appendix A SP-11, N17 (source note section 3.5)"
  ring_h_over_b: {central: 6.5, low: 1.0, high: 12.0, assumed: true, note: "h the section depth along the push, b its radial width. High: LOV10 PDF p.4-5's manufacturing limit 12.0 on orthogrid rings (an analogue). Low assumed: a square section. Central: the midpoint. The ring is sized to the larger of bending and the torsion-plus-shear and von Mises check (D-SP7-37; source note sections 3.5, 11, 13 item 15)"}
  fitting_factor: {value: 1.15, assumed: true, note: "14 CFR 25.625 (CFR25, opened 2026-10-08), 'a fitting factor of at least 1.15', an analogue regulation, the ring assumed wrought; applied to the whole ring section (source note section 3.5)"}

nof:
  nof_barrel: {central: 1.80, low: 1.54, high: 1.90, assumed: true, note: "WU24 PDF p.27: SLWT LH2 barrel 'Apply 1.80 average NOF' (central), 'Apply 1.54 acreage NOF' (low). High: WU13 PDF p.9's coarse bulkhead average 1.90 applied to a barrel (an analogue). Skin-based stations: every LOX station, hoop- or combined-sized RP-1 stations, the tube; with nof_entry_ratio, the ring (source note section 4; D-SP7-37)"}
  nof_stiffened: {central: 1.61, low: 1.45, high: 1.90, assumed: true, note: "WU24 PDF p.29's 1.24 (an optimized panel to as-built) times the central Gerard row's calibration to LOV10's PANDA2 designs: 1.2955 for 2195 (central, 1.606) and 1.1724 for 2219 (low, 1.454), an analogue calibration. High: the same as nof_barrel's. Stations sized by a Gerard row or the plate-limited row; with nof_entry_ratio, the skirt (source note sections 3.3, 4; D-SP7-37)"}
  nof_dome: {central: 1.90, low: 1.50, high: 2.36, source: "WU13 PDF p.1, 8 (Table 3), 9: coarse gore factors 1.28-2.76, average 1.90 (central); whole-bulkhead averages 1.50 (LO2 aft bulkhead) to 2.36 (the range: the factor multiplies a whole dome's increment)"}
  nof_entry_ratio: {central: 1.47, low: 1.05, high: 1.47, assumed: true, note: "WU13 PDF p.12 (section IX): gores aft of the longeron forgings that introduce the SSME loads 47% above acreage (central and high, the analogue nearest the push); the gores distributing the SRB thrust into the LO2 tank 5% above (low, kept only because the range equals the sources' spread). Dome gores standing for a skirt and a ring, an analogue (source note section 4)"}

dynamics:
  rise_time_s: {central: 0.5, low: 0.1, high: 1.0, assumed: true, note: "User decision D-SP7-09: the assumed real-drive force rise time of constant_accel, independent of the frequency; no catapult rise time published in anything opened (S07 section 5)"}
  axial_frequency_Hz: {central: 5.0, low: 2.0, high: 10.0, assumed: true, note: "User decision D-SP7-09: the stack's first axial frequency on its carriage. Context only: CR1540 Fig. 3-9, PDF p.42 (Saturn V 3.75 Hz at 100% propellant); LAR08 PDF p.3, 7; SP8055 PDF p.5 (source note section 4)"}

ring:
  ring_pads: {central: 8, low: 4, high: 8, assumed: true, note: "A facility choice. Central: the engine mount's eight-fold symmetry (FUG25 printed p.8, inferred as a layout). Low: the four leg attachments (FUG15 PDF p.10). High: the central, because above it the saving would rest partly on uncharged per-pad hardware (source note section 4)"}

thrust_structure:
  k_ts_kg_per_kN: {central: 0.2805, low: 0.197, high: 0.628, assumed: true, note: "The mass per kN of added load between T_max and the push's load through the thrust structure. Central: the median of the opened readings counted once per relation (D-SP7-37), below the note's nine-reading median 0.306 by 8.3% (and 0.2% above the design's 0.28), so at central the thrust-structure row's dm, linear in k_ts, is 8.3% lower than at the note's value. Low: Wu's S-II cone law applied across vehicles and the push (WU24 PDF p.13; derived, an analogue). High: Castellini's Ref. 5 curve extrapolated 65% beyond its chart with unknown parameters (CAS12 PDF p.83-84), kept as the adverse end (D-SP7-37). The readings are in plausibility (source note section 4)"}

interstage:
  interstage_k1_kg_per_m2p4856: {value: 13.740, source: "CAS12 Table 15, PDF p.83 (printed 65): lower-stage interstage M = k_SM k1 S (3.2808 D)^k2 with k1 7.7165; in SI 7.7165 x 3.2808^0.4856 = 13.740 (derived)"}
  interstage_k2: {value: 0.4856, source: "CAS12 Table 15, PDF p.83"}
  interstage_k_sm: {value: 0.7, source: "CAS12 Table 15, PDF p.83 (composite; 1.0 for aluminium); the interstage is composite (FUG15 PDF p.11)"}
  interstage_exponent: {value: 0.6, assumed: true, note: "The central Gerard row's exponent for a composite sandwich no Gerard row describes; fixed (source note section 5.5)"}
  charged_to: {value: stage1, assumed: true, note: "User decision D-SP7-36: the interstage is stage-1 hardware (FUG15 PDF p.11; it leaves with stage 1, CAS12 PDF p.83), so its increment is charged to stage 1"}

payload_limits:
  payload_limit_axial_max_g: {value: 6.0, source: "FUG25 Table 5-3 and Fig. 5-1, printed p.33 (PDF p.44): quasi-static flight limit load factors, payloads over 1,800 kg (compression positive)"}
  payload_limit_axial_min_g: {value: -2.0, source: "FUG25 Table 5-3 and Fig. 5-1, printed p.33 (PDF p.44)"}
  polygon:
    axial_g: [6.0, 4.0, 3.5, -1.5, -1.5, -2.0, -2.0, -1.5, -1.5, 3.5, 4.0, 6.0]
    lateral_g: [0.5, 0.5, 2.0, 2.0, 0.5, 0.5, -0.5, -0.5, -2.0, -2.0, -0.5, -0.5]
    source: "FUG25 Table 5-3 and Fig. 5-1, printed p.33 (PDF p.44): the polygon's vertices in order, closing at the first (recorded, not used: the model is axial)"

plausibility:
  heineman_kg_per_m2p25: {value: 68.404, source: "WU24 PDF p.24-26: Heineman's M = 10.41 V^0.75 (lbm, ft^3), tanks and insulation only; in SI 68.404 V_m3^0.75 (derived); Heineman JSC-26098 not opened"}
