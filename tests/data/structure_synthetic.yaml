# A synthetic structure file (SP7 step S3): a test input for the coupling of the structural
# model to the offload solve, never read by an experiment of experiments/ and never a
# pre-registered case (D-SP7-31). Written once by a script from
# configs/structures/generic_f9_class_2d.yaml: the gate file's sections (aliases expanded)
# with name, description and applies_to changed, 100 stations per barrel, the central
# values of F_tu, the four non-optimum factors, the rise time, the axial frequency, the
# ullage fraction and the four tanks' MEOP moved inside their ranges (each marked as a
# synthetic test value), and synthetic sets (each continuous value of the gate's set
# moved halfway to its central). Its numbers are not findings.

name: structure_synthetic
description: 'A synthetic structure file for the tests of SP7 step S3 (the coupling to the offload solve):
  the gate file''s sections with fewer stations, several central values moved inside their ranges and
  synthetic sets; a test input, not a model of any vehicle, and never a pre-registered case (D-SP7-31)'
applies_to:
- generic_f9_class_2d
layout:
  radius_m:
    value: 1.83
    source: FUG15 Table 2-1, PDF p.11; FUG25 Table 2-1, printed p.9 (3.66 m, both stages)
  stations_per_barrel:
    value: 100
    assumed: true
    note: synthetic test value (tests/data/structure_synthetic.yaml, SP7 step S3), not a source
  fairing_height_m:
    value: 13.2
    source: FUG15 section 5.1.2, PDF p.36; FUG25 printed p.16 (13.2 m overall; the implied stack length
      of source note section 2.4)
  stack_length_m:
    value: 70.0
    source: FUG15 Table 2-1, PDF p.11; FUG25 Table 2-1, printed p.9 (70 m with interstage and fairing;
      the length budget of source note section 2.4, not imposed)
  stages:
  - name: stage1
    tank_order:
      value:
      - rp1
      - lox
      source: FUG15 PDF p.10; FUG25 printed p.8 (a common dome between LOX and RP-1; the LOX transfer
        tube runs through the RP-1 tank, so LOX is above RP-1)
    common_dome:
      value: true
      source: FUG15 PDF p.10; FUG25 printed p.8
    construction:
      value:
        aft_skirt: stiffened_gerard
        rp1_barrel: stiffened_gerard
        lox_barrel: monocoque_sp8007
        domes: membrane_dome
        transfer_tube: hoop_tube
        load_ring: ring_frame
        interstage: composite_relation
      assumed: true
      note: Barrels from FUG15 Table 2-1, PDF p.11 ('LOX tank - monocoque; Fuel tank - skin and stringer');
        the aft skirt's stiffened form, the domes as crown-sized membranes, the tube's hoop, the ring
        frame and the interstage's relation are the design's forms (design 4.2, 4.2.3, 4.2.4; source note
        sections 2.3 and 12)
  - name: stage2
    tank_order:
      value:
      - rp1
      - lox
      assumed: true
      note: 'Assumed the same as stage 1 from ''a shorter version of the first-stage tank'' (FUG15 PDF
        p.11; FUG25 printed p.9). The guides disagree read literally: the latch sentence puts the fuel
        tank at the base (FUG15 PDF p.12), the harness sentence at the top (FUG15 PDF p.38); source note
        section 2.2'
    common_dome:
      value: true
      assumed: true
      note: assumed from the same sentence as the tank order (source note section 2.2)
    construction:
      value:
        rp1_barrel: stiffened_gerard
        lox_barrel: monocoque_sp8007
        domes: membrane_dome
        transfer_tube: hoop_tube
      assumed: true
      note: 'FUG15 Table 2-1: the same construction wording for stage 2 (''Fuel tanks''); the tank order
        is assumed (source note section 2.2)'
    aft_skirt_length_m:
      value: 0.0
      assumed: true
      note: 'inferred from the latch sentence alone (FUG15 PDF p.12): the latches sit at the base of the
        stage-2 tank, so stage 2 has no aft skirt in the load path (source note sections 2.2 and 12)'
mixture:
  stage1:
    lox_mass_fraction:
      value: 0.69944
      assumed: true
      note: 287.4/410.9 from the vehicle file's masses (WIKI-FT citing Espace & Exploration No. 39 [quoted],
        configs/vehicles/generic_f9_class_2d.yaml lines 46-59); source note section 2.3
  stage2:
    lox_mass_fraction:
      value: 0.699535
      assumed: true
      note: 75.2/107.5 from the vehicle file's masses (WIKI-FT citing Espace & Exploration No. 39 [quoted]);
        source note section 2.3
materials:
  block_alloy:
    value: '2195'
    assumed: true
    note: 'The barrels'' alloy from FUG15 Table 2-1, PDF p.11 (''Aluminum lithium skin''), read as 2195
      (LOV10 Table 1, PDF p.3: 2195-T8R78); assumed for the aft skirt, the ring frame and the transfer
      tube, whose alloys are not public (source note sections 2.3, 3.1 and 11)'
  E_GPa:
    central: 75.84
    low: 72.0
    high: 79.6
    assumed: true
    note: 'Central: LOV10 Table 1, PDF p.3 (2195-T8R78, 11.0 Msi) and HL19 PDF p.12, 18 (11.0 Msi ''a
      typical conservative design assumption''; tension 10.8 and compression 11.4 Msi = 74.5 and 78.6
      GPa). Range +/-5% assumed, covering both opened moduli; the high end 1.3% above the compression
      modulus is an allowance (source note section 3.1)'
  nu:
    central: 0.33
    low: 0.3
    high: 0.33
    source: LOV10 Table 1, PDF p.3; HL19 PDF p.12 (0.33); SP8007-20 Eq. 49, PDF p.51 and SP8007-68 write
      their simplified constants for nu = 0.3 (the low end)
  rho_wall_kg_per_m3:
    central: 2712.6
    low: 2698.8
    high: 2726.5
    source: LOV10 Table 1, PDF p.3 (0.098 lb/in^3); HL19 PDF p.12; the range is the published value's
      last digit, 0.0975-0.0985 lb/in^3
  F_tu_MPa:
    central: 540.0
    low: 520.0
    high: 558.5
    assumed: true
    note: synthetic test value (tests/data/structure_synthetic.yaml, SP7 step S3), not a source
  eta_weld:
    central: 1.0
    low: 0.7
    high: 1.0
    assumed: true
    note: 'Central and high a rule from Wu''s factor practice (WU13 PDF p.1, 8; WU24 PDF p.27: the coarse
      non-optimum factors carry the weld lands), an analogue; low BHAT01 PDF p.5 (friction-stir welds
      in 2195 at 70% of parent metal). Applies to hoop, the combined mode, the domes and the tube (source
      note section 3.1)'
  dome_alloy:
    central: 2219-T851
    alternatives:
    - '2195'
    assumed: true
    note: 'Central: FUG15 and FUG25 Table 2-1 ''Aluminum lithium skin; aluminum domes'' read as a conventional
      alloy (inferred); 2219-T851 is the one conventional tank alloy whose allowables were opened (LOV10
      Table 1, PDF p.3; SA503 PDF p.58: the S-IC''s 2219 bulkheads). Alternative: the 2195 block if ''aluminum''
      includes Al-Li (WU13 PDF p.3: the SLWT LO2 aft bulkhead''s 2195 gores, an opened analogue with an
      assumed reading); source note section 3.1'
  dome_alloys:
    2219-T851:
      F_tu_MPa:
        value: 455.05
        source: LOV10 Table 1, PDF p.3 (2219-T851 Ftu 66.0 ksi, from MMPDS-04)
      rho_wall_kg_per_m3:
        value: 2851.0
        source: LOV10 Table 1, PDF p.3 (0.103 lb/in^3; derived 2851.0 kg/m^3)
factors:
  FS_ult:
    value: 1.4
    source: FUG15 section 1.4, PDF p.6 (1.4 versus the traditional 1.25 for flight without crew); STD5001B
      Table 1, PDF p.18 (ultimate 1.4); FUG25 Table 6-1, printed p.43 (1.40 for ground operations); SX09
      (tank ultimate 1.4 x MEOP)
